server.port=8080

# Secrets are NOT stored here. Provide them via environment variables
# (DB_PASSWORD, JWT_SECRET, optionally RABBITMQ_PASSWORD) or via an untracked
# application-local.properties on the classpath (see application-local.properties.example).
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/shumaim_wallet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No explicit dialect: Hibernate 6.6 auto-detects MySQL 9. Forcing
# MySQL8Dialect here only produces a deprecation warning and can generate
# the wrong DDL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Fail fast instead of hanging when the broker is not running; the service
# falls back to synchronous processing.
spring.rabbitmq.connection-timeout=2000
spring.rabbitmq.template.reply-timeout=2000

# Must be at least 32 characters. Read by com.shumaim.wallet.service.JwtService.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
